<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Usine Clips - TikTok connected</title>
<style>
  :root { --bg:#0f0f12; --card:#1b1b21; --text:#f2f2f5; --muted:#a0a0ab; --accent:#fe2c55; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:560px; margin:48px auto; padding:0 16px; }
  .card { background:var(--card); border-radius:14px; padding:24px; }
  h1 { font-size:22px; margin:0 0 8px; }
  p { color:var(--muted); }
  code { display:block; word-break:break-all; background:#000; padding:12px; border-radius:8px; color:#fff; }
  button { margin-top:12px; background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 18px; font-size:16px; cursor:pointer; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1 id="t">TikTok account connected</h1>
    <p id="m">Usine Clips can now publish your finished videos to this TikTok account. Copy the code below into Usine Clips to finish.</p>
    <code id="c"></code>
    <button id="b">Copy code</button>
  </div>
</main>
<script>
  const q = new URLSearchParams(location.search);
  const code = q.get("code"), err = q.get("error");
  if (err) {
    document.getElementById("t").textContent = "Connection cancelled";
    document.getElementById("m").textContent = q.get("error_description") || err;
    document.getElementById("c").style.display = "none";
    document.getElementById("b").style.display = "none";
  } else {
    document.getElementById("c").textContent = location.href;
  }
  document.getElementById("b").onclick = () => {
    navigator.clipboard.writeText(location.href).then(() => document.getElementById("b").textContent = "Copied");
  };
</script>
</body>
</html>
